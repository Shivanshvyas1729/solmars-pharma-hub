<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
  </head>
  <body>
    <p>Redirecting to the application…</p>
    <script>
      const repoBase = "/solmars-pharma-hub";
      const pathname = window.location.pathname.replace(/\/+$/, "");
      const relativePath = pathname.startsWith(repoBase)
        ? pathname.slice(repoBase.length)
        : pathname;
      const hash = relativePath === "" ? "#/" : `#${relativePath}`;
      window.location.replace(`${repoBase}/${hash}`);
    </script>
  </body>
</html>
