# =============================================================================
# SETTINGS CONFIGURATION
# =============================================================================
# Global site settings — SEO, contact info, navigation links.
# Changes here affect the entire website.
# =============================================================================

# ─── SITE INFO ───────────────────────────────────────────────────────────────
siteName: "Solmars Pharma Hub"
defaultLanguage: "en"

# ─── SEO SETTINGS ────────────────────────────────────────────────────────────
# These values appear in Google search results and browser tabs.
# Keep the title under 60 characters and description under 160 characters.
seo:
  title: "Solmars Pharma — Trusted Pharmaceutical Solutions for Humanity"
  description: "Solmars Pharma is an Ahmedabad-based pharmaceutical company delivering quality generic medicines, formulations and healthcare products."
  keywords:
    - "pharma"
    - "pharmaceutical"
    - "medicine"
    - "healthcare"
    - "solmars"
    - "Ahmedabad"

# ─── CONTACT DETAILS ─────────────────────────────────────────────────────────
# Shown in the footer and the Contact page.
contact:
  email: "info@solmarspharma.com"
  phone: "+91 00000 00000"
  address: "SG Highway, Ahmedabad, Gujarat, India - 380015"

# ─── NAVIGATION LINKS ────────────────────────────────────────────────────────
# The links shown in the main header navigation.
# 'label' is the text shown, 'url' is the page path.
navigation:
  - label: "Home"
    url: "/"
  - label: "Products"
    url: "/products"
  - label: "Services"
    url: "/services"
  - label: "About Us"
    url: "/about"
  - label: "Contact"
    url: "/contact"
