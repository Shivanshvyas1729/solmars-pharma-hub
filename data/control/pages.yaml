      number: +91 00000 00000
  services:
    hero:
      title: Contract manufacturing and pharmaceutical partnerships
      subtitle: We provide dependable manufacturing capacity and distribution support for healthcare businesses across India.
    items:
      - title: Pharma Marketing
        content: Brand-building, field promotion and clinician engagement across
          therapeutic segments.
      - title: Distribution Support
        content: Reliable supply, logistics planning and partner enablement across
          regions.
      - title: Healthcare Partnerships
        content: Long-term relationships with hospitals, clinics and institutional
          buyers.
      - title: Third-party Manufacturing
        content: Contract manufacturing of formulations under strict quality protocols.
      - title: Medical Supply Chain
        content: Optimized inventory, packaging and last-mile coordination for
          healthcare networks.
      - title: B2B Pharma Solutions
        content: Tailored programs for institutions, government tenders and bulk supply
          needs.
    cta:
      heading: Explore a partnership with Solmars Pharma
      content: Share your requirements and our business team will respond with a
        structured proposal.
      button:
        label: Start a conversation
        url: /contact
  careers:
    hero:
      title: Build a meaningful career in pharmaceutical healthcare
      subtitle: At Solmars Pharma, your work directly impacts the lives of patients
        and the practice of medicine. We are building a team that shares our
        commitment to quality and humanity.
    culture:
      - title: People-first culture
        content: Respect, collaboration and continuous learning shape how we work.
      - title: Growth & training
        content: Ongoing development and exposure across pharmaceutical functions.
      - title: Purpose-driven work
        content: Every role contributes to better healthcare outcomes.
      - title: Wellbeing
        content: Programs and policies designed to support employee wellness.
    open_roles:
      heading: We are growing across functions
      content: We hire across manufacturing, quality, R&D, sales, marketing, supply
        chain and corporate functions. New openings are posted as our teams
        expand.
    apply:
      heading: Send us your profile
      content: Share your CV and area of interest — we'll reach out when a relevant
        role opens.
      button:
        label: Apply via contact form
        url: /contact
