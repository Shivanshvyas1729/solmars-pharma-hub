    updates:
      heading: Latest Updates
      content: Stay tuned for our latest product releases and health news.
  about:
    hero:
      title: A pharmaceutical company anchored in trust and science
      subtitle: Headquartered in Ahmedabad, Gujarat, Solmars Pharma is dedicated to building a healthier tomorrow through reliable formulations, ethical practice, and partnerships with healthcare professionals.
    story:
      title: Our story
      content1: Founded with a singular purpose — to make quality medicines accessible
        to all — Solmars Pharma has grown into a trusted name in pharmaceutical
        formulations, generic medicines and healthcare products. Our work is
        guided by science, sharpened by experience, and inspired by the patients
        we serve.
      content2: We collaborate with doctors, distributors and institutions to bring
        dependable therapies to communities across India and beyond, while
        building a scalable foundation for the next chapter of our growth.
    values_heading: Mission, vision and values
    values:
      - title: Mission
        content: To deliver high-quality, affordable pharmaceutical solutions that
          improve patient outcomes and strengthen healthcare access.
      - title: Vision
        content: To be a trusted pharmaceutical partner advancing healthcare for
          communities across India and the world.
      - title: Values
        content: Integrity, scientific rigor, patient-first thinking, and an unwavering
          commitment to quality and compliance.
      - title: Commitment
        content: We honor our responsibility to doctors, distributors, hospitals and
          patients with consistent, ethical practice.
    pillars:
      - title: Market presence
        content: Active distribution and partnerships across major Indian states with a
          growing international footprint.
      - title: Leadership philosophy
        content: Disciplined operations, ethical decision-making and an open culture of
          accountability.
      - title: Future growth
        content: Expanding therapeutic depth, manufacturing capability and digital
          infrastructure for tomorrow.
  quality:
    hero:
      title: Science, discipline and safety at every stage
      subtitle: Quality is not a stage in our process — it is the foundation of every product we manufacture and every relationship we hold.
    story:
      title: A quality-first manufacturing culture
      content1: From raw material sourcing to finished-goods release, our processes
        are designed for repeatable quality. We maintain rigorous documentation,
        controlled environments and a compliance-first mindset across every
        formulation.
      content2: Our research approach focuses on clinically relevant formulations —
        built to meet real-world patient needs and prescribing realities for
        healthcare professionals.
    pillars_heading: Six commitments behind every product
    pillars:
      - title: Quality Assurance
        content: Multi-stage QA framework covering raw material qualification,
          in-process checks and finished-product release.
      - title: Manufacturing Standards
        content: GMP-aligned facilities and processes designed for consistency, safety
          and traceability.
      - title: Compliance
        content: Documentation, batch records and regulatory alignment built into every
          operation.
      - title: Research Philosophy
        content: Evidence-led formulation work centered on patient outcomes and clinical
          relevance.
      - title: Safety Commitment
        content: Stability, bioequivalence and pharmacovigilance practices that put
          patient safety first.
      - title: Continuous Improvement
        content: Investment in technology, training and audits to raise our standards
          every year.
    certifications:
      title: Building toward globally recognized standards
      content: We continuously invest in audits, accreditations and certifications to
        strengthen confidence for our partners, regulators and patients.
  contact:
    hero:
      title: Partner with Solmars Pharma
      subtitle: Whether you are a healthcare professional, distributor or institution, our team is ready to support your requirements.
    office:
      title: Head Office
      location: Ahmedabad, Gujarat, India
    email:
