# =============================================================================
# PRODUCTS CATALOG
# =============================================================================
# This file controls all products shown on the website.
# Products are organized into categories (e.g. Pain Management, Neurology).
#
# HOW TO ADD A NEW PRODUCT:
#   1. Find the correct category below (or add a new one)
#   2. Copy any existing product block (from "- slug:" to the end of its fields)
#   3. Paste it under the same category and fill in your details
#
# HOW TO ADD A NEW CATEGORY:
#   1. Add a new "- categoryName:" block under "categories:"
#   2. Add at least one product under its "products:" list
#
# REQUIRED FIELDS:  slug, name, description
# OPTIONAL FIELDS:  shortName, image, composition, dosageForm, packaging,
#                   segment, therapeuticUse, benefits, usage, storage, safety
# =============================================================================

